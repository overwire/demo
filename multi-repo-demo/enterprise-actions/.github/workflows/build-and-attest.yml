name: Build and Attest

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version
        type: string
        required: false
        default: '20'
      artifact-name:
        description: Name for the build artifact
        type: string
        required: false
        default: build-output
    outputs:
      artifact-name:
        description: Uploaded artifact name
        value: ${{ jobs.build.outputs.artifact-name }}
      cache-hit:
        description: Whether the npm cache was restored
        value: ${{ jobs.build.outputs.cache-hit }}

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ inputs.artifact-name }}
      cache-hit: ${{ steps.cache.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Restore npm cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ inputs.node-version }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ inputs.node-version }}-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: |
          mkdir -p dist
          echo '{"name":"acme-app","version":"1.0.0"}' > dist/manifest.json
          echo "Build complete"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: dist/
          retention-days: 7

  verify:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: downloaded/

      - name: Verify artifact contents
        run: |
          echo "Downloaded artifact contents:"
          ls -la downloaded/
          cat downloaded/manifest.json

      - name: Request OIDC token
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        run: |
          echo "OIDC token endpoint: ${ACTIONS_ID_TOKEN_REQUEST_URL:-not-set}"
          echo "Attestation identity verified"

      - name: Attestation summary
        env:
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
          CACHE_HIT: ${{ needs.build.outputs.cache-hit }}
        run: |
          echo "## Build & Attestation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Artifact:** ${ARTIFACT_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Cache hit:** ${CACHE_HIT}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **OIDC:** Token requested" >> "$GITHUB_STEP_SUMMARY"

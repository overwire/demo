uses: anchore/sbom-action@v0
description: |
  Generates a Software Bill of Materials using syft. In mock mode we return
  the path the action would have written so the upload-artifact step can
  treat it as a normal artifact.
inputs:
  path:
    description: Working directory or file to scan
    required: false
    default: '.'
  format:
    description: SBOM format (cyclonedx-json | spdx-json | syft-json)
    required: false
    default: cyclonedx-json
  artifact-name:
    description: Name of the SBOM artifact written to disk
    required: false
    default: sbom
  output-file:
    description: Output filename for the SBOM document
    required: false
outputs:
  path: sbom.json
  cyclonedx-json: sbom.json

uses: acme-corp/enterprise-actions/.github/actions/db-migrate@main
description: Mock contract for containerized database migration action
inputs:
  database-url:
    description: PostgreSQL connection string for the target database
    required: true
  direction:
    description: Migration direction (up or down)
    required: true
    default: up
  dry-run:
    description: Whether to simulate without applying changes
    required: false
    default: 'false'
outputs:
  applied-count: '3'
  current-version: '2025.05.21'

# yaml-language-server: $schema=https://docs.overwire.io/schemas/api-mocks.schema.json
routes:
  - method: POST
    path: /repos/:owner/:repo/check-runs
    status: 201
    body:
      id: 7001
      name: mock-check
      conclusion: success

  - method: GET
    path: /repos/:owner/:repo/commits/:sha/check-runs
    status: 200
    body:
      total_count: 3
      check_runs:
        - name: Build
          conclusion: success
        - name: Security
          conclusion: success
        - name: Audit
          conclusion: success

  - method: POST
    path: /repos/:owner/:repo/issues/:number/labels
    status: 200
    body:
      - name: compliance-exception

  - method: POST
    path: /repos/:owner/:repo/issues/:number/comments
    status: 201
    body:
      id: 9002
      body: Mock comment response

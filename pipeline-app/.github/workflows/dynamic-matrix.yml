name: Dynamic Matrix

# Phase 7 reference — requires fromJSON() dynamic matrix support

on:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.scan.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
      - name: Discover packages
        id: scan
        run: |
          echo 'packages=["src","lib"]' >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    needs: discover
    strategy:
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Test package
        env:
          PKG: ${{ matrix.package }}
        run: echo "Testing ${PKG}"

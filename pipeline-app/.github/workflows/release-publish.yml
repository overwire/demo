name: Release Publish

on:
  release:
    types: [published]

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      is-prerelease: ${{ steps.check.outputs.is-prerelease }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Validate release tag
        id: check
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_NAME: ${{ github.event.release.name }}
        run: |
          echo "Release: ${RELEASE_NAME}"
          echo "Tag: ${TAG_NAME}"

          if ! echo "$TAG_NAME" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::Invalid tag format: expected vX.Y.Z, got ${TAG_NAME}"
            exit 1
          fi

          VERSION="${TAG_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "is-prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    uses: acme-corp/enterprise-actions/.github/workflows/build-nodejs-npm.yml@main
    with:
      node-version: '20'
    secrets: inherit

  sbom:
    needs: build
    uses: acme-corp/enterprise-actions/.github/workflows/generate-sbom.yml@main
    with:
      artifact-name: release-sbom

  publish:
    runs-on: ubuntu-latest
    needs: [validate, build, sbom]
    if: ${{ !fromJSON(needs.validate.outputs.is-prerelease || 'false') }}
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-sbom

      - name: Publish package
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          BUILD_STATUS: ${{ needs.build.outputs.build-status }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "Publishing version ${VERSION} to npm registry"
          echo "Build status: ${BUILD_STATUS}"

      - name: Release summary
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          TAG: ${{ github.event.release.tag_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
        run: |
          echo "## Release Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version:** ${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tag:** ${TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Release:** ${RELEASE_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **SBOM:** Attached" >> "$GITHUB_STEP_SUMMARY"

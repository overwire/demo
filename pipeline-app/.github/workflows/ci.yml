name: CI

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'src/**'
      - 'lib/**'
      - 'package*.json'

defaults:
  run:
    working-directory: .

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: acme-corp/enterprise-actions/.github/actions/setup-project@main
        with:
          node-version: '20'
      - name: Run linter
        id: lint
        continue-on-error: true
        run: npm run lint
      - name: Lint outcome
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
        run: echo "Lint result: ${LINT_OUTCOME}"

  build:
    uses: acme-corp/enterprise-actions/.github/workflows/build-nodejs-npm.yml@main
    with:
      node-version: '20'
    secrets: inherit

  test:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        node-version: ['18', '20', '22']
        include:
          - node-version: '20'
            coverage: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - name: Run tests
        run: npm test
      - name: Coverage report
        if: ${{ matrix.coverage }}
        run: echo "Coverage collected for Node ${{ matrix.node-version }}"

  summary:
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, build, test]
    steps:
      - name: Pipeline summary
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          BUILD_STATUS: ${{ needs.build.outputs.build-status }}
          TEST_RESULT: ${{ needs.test.result }}
          PRODUCT: ${{ vars.PRODUCT }}
          RELEASE_CHANNEL: ${{ vars.RELEASE_CHANNEL }}
        run: |
          echo "## ${PRODUCT} CI Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Stage | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Lint | ${LINT_RESULT} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build | ${BUILD_STATUS} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Test | ${TEST_RESULT} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Release channel: **${RELEASE_CHANNEL}**" >> "$GITHUB_STEP_SUMMARY"
